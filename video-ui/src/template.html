<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>毕设糖基化分析系统 · W2 周报录制台</title>
  <style>
__DECK_CSS__
  </style>
</head>
<body>
  <div class="viewport">
    <main
      id="deck"
      class="deck"
      data-deck-mounted="false"
      data-active-slide="0"
      data-slide-id=""
      data-notes-visible="false"
      aria-label="毕设糖基化分析系统第二周交付周报"
    >
      <aside class="chapter-rail" aria-label="章节导航">
        <div class="rail-head">
          <p class="rail-kicker">GLYCO / W02</p>
          <p class="rail-title">周报<br>纪录片</p>
        </div>
        <div class="milestones" id="milestones" aria-label="周次进度"></div>
        <nav id="chapter-nav" class="chapter-nav"></nav>
        <div class="rail-foot">
          <span>← → 翻页</span>
          <span>N 讲稿</span>
          <span>F 全屏</span>
        </div>
      </aside>

      <section class="stage">
        <header class="stage-head">
          <span id="stage-range">W01 - W02</span>
          <span id="stage-chapter">开场</span>
        </header>
        <div id="slide-root" class="slide-root"></div>
        <footer class="stage-foot">
          <p id="slide-source" class="slide-source"></p>
          <div class="progress-wrap" aria-label="幻灯片进度">
            <div class="progress-track">
              <span id="progress-fill" class="progress-fill"></span>
            </div>
            <span id="slide-counter" class="slide-counter"></span>
          </div>
        </footer>
      </section>

      <aside
        id="speaker-notes"
        class="speaker-notes"
        aria-hidden="true"
        aria-label="讲稿"
      >
        <div class="notes-label">讲稿 / N 隐藏</div>
        <p id="notes-copy"></p>
      </aside>
    </main>
  </div>
  <noscript>此页面需要启用 JavaScript 才能播放周报。</noscript>
  <script id="story-data" type="application/json">__STORY_JSON__</script>
  <script>
__DECK_JS__
  </script>
</body>
</html>
